id: type-coverage-monitor
title: "Type Coverage Monitor"
status: ready
summary: "Measures TypeScript strict-mode type coverage weekly and opens a tracking issue when coverage falls below the configured minimum."
readiness: direct-copy
showOnWebsite: true
showInDashboard: true
fit:
  jobsToBeDone:
    - maintain-and-modernize
  bestFor:
    - TypeScript repositories that want to track and improve strict-mode type coverage over time.
    - Teams migrating to strict TypeScript who need weekly trend visibility.
  notFor:
    - Non-TypeScript repositories.
    - Teams already using a dedicated type coverage reporting tool with issue creation.
requirements:
  requiredIntegrations:
    - github
  optionalIntegrations: []
  other:
    - A TypeScript project with a type coverage tool runnable via sandbox (e.g. type-coverage).
adaptations:
  - key: type_coverage_command
    label: Type coverage command
    description: Shell command to measure TypeScript type coverage and output detailed results.
    required: false
    default: "pnpm dlx type-coverage --strict --detail"
  - key: min_pct
    label: Minimum type coverage percentage
    description: Type coverage percentage below which a tracking issue is opened.
    required: false
    default: "90"
  - key: exclude_paths
    label: Paths to exclude
    description: JSON array of directory or file patterns to exclude from type coverage scanning.
    required: false
    default: '["node_modules", "dist", "build"]'
specializationIdeas:
  - Raise min_pct to 95 or 100 for teams aiming for full strict coverage.
  - Add Slack notifications when coverage drops for immediate team visibility.
