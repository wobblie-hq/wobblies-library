id: accessibility-checker
title: "Accessibility Checker"
status: ready
summary: "Reviews pull request diffs for concrete accessibility violations in changed UI files, commenting with WCAG-cited findings so teams catch a11y regressions before merge."
readiness: direct-copy
showOnWebsite: true
showInDashboard: true
fit:
  jobsToBeDone:
    - maintain-and-modernize
  bestFor:
    - Teams building web UIs that must meet WCAG 2.1 Level A or AA compliance.
    - Repositories with frontend components where accessibility regressions slip through review.
  notFor:
    - Backend-only repositories with no UI files.
    - Teams that rely exclusively on dedicated a11y testing tools in CI.
requirements:
  requiredIntegrations:
    - github
  optionalIntegrations: []
  other: []
adaptations:
  - key: ui_globs
    label: UI file globs
    description: Glob pattern for UI files to check. Default covers common frontend extensions.
    required: false
    default: "**/*.{tsx,jsx,html,vue,svelte}"
specializationIdeas:
  - Narrow ui_globs to your component directory for faster, focused checks.
  - Extend to include .astro or .erb files if your stack uses them.
