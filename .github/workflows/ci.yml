name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - name: Validate examples (authoring lint)
        run: bun scripts/validate-examples.ts --report lint-report.json

      - name: Generated-artifact freshness
        run: |
          bun scripts/generate-examples.ts
          cp examples.json wobblies.json
          git diff --exit-code wobblies.json examples.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: ignore
